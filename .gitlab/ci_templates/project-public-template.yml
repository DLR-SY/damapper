## User-defined environment variables for all jobs
# Adding submodule support for public repositories with non-public branches
include:
  - remote: 'https://gitlab.com/dlr-sy/pyxmake/-/raw/master/templates/project-pages/template.yml'
  - remote: 'https://gitlab.com/dlr-sy/pyxmake/-/raw/master/.gitlab/ci_templates/project-public-template.yml'
  - project: 'DLR-SY/PyXMake'
    file: '/templates/project-artifacts/template.yml'
    inputs:
      base-url: "https://gitlab.dlr.de"
      ref-name: "dam_docs"
      stage-name: "deploy"
      job-name: "pages"
      image: "stmlab/conda:debian"
      token: "$SY_DEPLOY_TOKEN"
      project-id: "$SY_UPSTREAM_PROJECT_ID"

# Do not define any stages
stages: null

## All job template updates
# Add or modify imported jobs to include local changes
build:
  rules: [when: never]
  allow_failure: true

deploy:
  rules: [when: never]
  allow_failure: true

## GitLab documentation fetch job
# Fetch documentation from upstream repository
download:
  stage: null
  rules: [!reference [.default_rules, build]]

## GitLab Pages
# Publish static documentation with GitLab Pages
pages:
  tags: [nimbus]
  needs: [download]
  rules: [!reference [.default_rules, build]]
  image: python:latest
  cache: null
  before_script:
    - ls -a 
    - unzip artifacts.zip
    - ls -a
  script:
    # We are here
    - echo "Test"