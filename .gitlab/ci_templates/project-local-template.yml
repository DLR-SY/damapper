## User-defined includes for all jobs
# Import general job definition for GitLab pages.
include:
  remote: 'https://gitlab.com/dlr-sy/mcodac/-/raw/mcd_development/.gitlab/ci_templates/project-local-template.yml'

## All job template updates
# Add or modify imported jobs to include local changes
build: null

## GitLab documentation job
# Fetch documentation from upstream repository
documentation:
  extends: []
  rules: [when: always]
  trigger:
    strategy: depend
    forward:
      pipeline_variables: true
    include:
    - project: 'DLR-SY/PyXMake'
      file: '/templates/project-artifacts/template.yml'
      inputs:
        base-url: "https://gitlab.dlr.de"
        ref-name: "dam_docs"
        stage-name: "deploy"
        job-name: "pages"
        image: "stmlab/conda:debian"
        token: "$SY_DEPLOY_TOKEN"
        project-id: "$SY_UPSTREAM_PROJECT_ID"

# Local GitLab pages modification for public builds
pages:
  needs: [documentation]
  script:
    - ls -a 
    # We are here
    - echo "Test"